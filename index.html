<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechFlow | Painel de projetos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: { fontFamily: { sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } }
  };
</script>
<link rel="stylesheet" href="src/css/style.css">
<script src="src/js/app.js" defer></script>
</head>
<body class="bg-stone-100 font-sans text-stone-800 antialiased dark:bg-stone-950 dark:text-stone-200">

<svg width="0" height="0" class="absolute" aria-hidden="true">
  <defs>
    <symbol id="i-flow" viewBox="0 0 24 24"><path d="M3 8c3-4 6-4 9 0s6 4 9 0M3 16c3-4 6-4 9 0s6 4 9 0"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  </defs>
</svg>

<div class="flex min-h-screen">

  <div id="sidebar-overlay" class="fixed inset-0 z-30 hidden bg-stone-950/50 lg:hidden" aria-hidden="true"></div>

  <aside id="sidebar" aria-label="Navegação principal"
    class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col border-r border-stone-200 bg-white transition-transform duration-300 ease-out dark:border-stone-800 dark:bg-stone-900 lg:sticky lg:top-0 lg:h-screen lg:shrink-0 lg:translate-x-0">
    <div class="flex h-16 items-center justify-between border-b border-stone-200 px-5 dark:border-stone-800">
      <a href="#conteudo" class="flex items-center gap-2.5 rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-600">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-teal-600 text-white"><svg class="icon h-5 w-5"><use href="#i-flow"/></svg></span>
        <span class="text-lg font-extrabold tracking-tight">TechFlow</span>
      </a>
      <button type="button" id="sidebar-close" aria-label="Fechar menu"
        class="rounded-md p-1.5 text-stone-500 transition hover:bg-stone-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-600 active:scale-95 dark:hover:bg-stone-800 lg:hidden">
        <svg class="icon h-5 w-5"><use href="#i-x"/></svg>
      </button>
    </div>

    <nav class="flex flex-1 flex-col gap-1 overflow-y-auto p-3" aria-label="Filtrar projetos por status">
      <p class="px-3 pb-1 pt-2 text-xs font-semibold uppercase tracking-wider text-stone-400">Projetos</p>
      <button type="button" data-status="all" class="nav-item"><svg class="icon h-4 w-4"><use href="#i-layers"/></svg>Todos<span data-count="all" class="ml-auto text-xs"></span></button>
      <button type="button" data-status="Em andamento" class="nav-item"><svg class="icon h-4 w-4"><use href="#i-flow"/></svg>Em andamento<span data-count="Em andamento" class="ml-auto text-xs"></span></button>
      <button type="button" data-status="Em revisão" class="nav-item"><svg class="icon h-4 w-4"><use href="#i-list"/></svg>Em revisão<span data-count="Em revisão" class="ml-auto text-xs"></span></button>
      <button type="button" data-status="Concluído" class="nav-item"><svg class="icon h-4 w-4"><use href="#i-check"/></svg>Concluídos<span data-count="Concluído" class="ml-auto text-xs"></span></button>
    </nav>

    <div class="border-t border-stone-200 p-3 dark:border-stone-800">
      <button type="button" data-open-modal
        class="flex w-full items-center justify-center gap-2 rounded-lg bg-teal-600 px-4 py-2.5 text-sm font-semibold text-white transition duration-200 hover:bg-teal-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-600 focus-visible:ring-offset-2 active:scale-[0.98] dark:focus-visible:ring-offset-stone-900">
        <svg class="icon h-4 w-4"><use href="#i-plus"/></svg>Novo projeto
      </button>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">

    <header class="sticky top-0 z-20 flex h-16 items-center justify-between gap-3 border-b border-stone-200 bg-white/90 px-4 backdrop-blur dark:border-stone-800 dark:bg-stone-900/90 sm:px-6 lg:px-8 2xl:px-12">
      <div class="flex min-w-0 flex-1 items-center gap-3">
        <button type="button" id="sidebar-toggle" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false"
          class="rounded-md p-2 text-stone-600 transition hover:bg-stone-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-600 active:scale-95 dark:text-stone-300 dark:hover:bg-stone-800 lg:hidden">
          <svg class="icon h-5 w-5"><use href="#i-menu"/></svg>
        </button>
        <div class="relative w-full max-w-md">
          <label for="search" class="sr-only">Pesquisar projetos</label>
          <svg class="icon pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-stone-400"><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Buscar por projeto, pessoa ou categoria" autocomplete="off"
            class="w-full rounded-lg border border-stone-200 bg-stone-50 py-2 pl-9 pr-3 text-sm placeholder:text-stone-400 transition focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-600/30 dark:border-stone-700 dark:bg-stone-800 dark:placeholder:text-stone-500">
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <fieldset class="flex rounded-lg border border-stone-200 bg-stone-50 p-0.5 dark:border-stone-700 dark:bg-stone-800">
          <legend class="sr-only">Tema da interface</legend>
          <label class="theme-option"><input type="radio" name="theme" value="light" class="peer sr-only"><span class="theme-pill peer-checked:bg-white peer-checked:text-teal-700 peer-checked:shadow-sm peer-focus-visible:ring-2 peer-focus-visible:ring-teal-600 dark:peer-checked:bg-stone-700 dark:peer-checked:text-teal-300"><svg class="icon h-4 w-4"><use href="#i-sun"/></svg><span class="sr-only md:not-sr-only">Light</span></span></label>
          <label class="theme-option"><input type="radio" name="theme" value="dark" class="peer sr-only"><span class="theme-pill peer-checked:bg-white peer-checked:text-teal-700 peer-checked:shadow-sm peer-focus-visible:ring-2 peer-focus-visible:ring-teal-600 dark:peer-checked:bg-stone-700 dark:peer-checked:text-teal-300"><svg class="icon h-4 w-4"><use href="#i-moon"/></svg><span class="sr-only md:not-sr-only">Dark</span></span></label>
          <label class="theme-option"><input type="radio" name="theme" value="system" class="peer sr-only"><span class="theme-pill peer-checked:bg-white peer-checked:text-teal-700 peer-checked:shadow-sm peer-focus-visible:ring-2 peer-focus-visible:ring-teal-600 dark:peer-checked:bg-stone-700 dark:peer-checked:text-teal-300"><svg class="icon h-4 w-4"><use href="#i-monitor"/></svg><span class="sr-only md:not-sr-only">System</span></span></label>
        </fieldset>

        <div class="relative">
          <button type="button" id="user-button" aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu"
            class="flex items-center gap-2 rounded-lg p-1 transition hover:bg-stone-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-600 active:scale-95 dark:hover:bg-stone-800">
            <span class="flex h-8 w-8 items-center justify-center rounded-full bg-stone-800 text-xs font-bold text-white dark:bg-stone-200 dark:text-stone-900">MD</span>
            <span class="hidden text-left leading-tight sm:block">
              <span class="block text-sm font-semibold">Marina Duarte</span>
              <span class="block text-xs text-stone-500 dark:text-stone-400">Gerente de produto</span>
            </span>
            <svg class="icon hidden h-4 w-4 text-stone-400 sm:block"><use href="#i-chevron"/></svg>
          </button>
          <div id="user-menu" role="menu" aria-labelledby="user-button"
            class="invisible absolute right-0 mt-2 w-60 origin-top-right scale-95 rounded-xl border border-stone-200 bg-white p-1.5 opacity-0 shadow-lg transition duration-150 ease-out dark:border-stone-700 dark:bg-stone-900">
            <div class="border-b border-stone-100 px-3 py-2 dark:border-stone-800">
              <p class="text-sm font-semibold">Marina Duarte</p>
              <p class="truncate text-xs text-stone-500 dark:text-stone-400">marina.duarte@techflow.com</p>
            </div>
            <button type="button" role="menuitem" data-user-action="mine" class="menu-item">Ver meus projetos</button>
            <button type="button" role="menuitem" data-user-action="new" class="menu-item">Novo projeto</button>
            <button type="button" role="menuitem" data-user-action="clear" class="menu-item">Limpar filtros</button>
          </div>
        </div>
      </div>
    </header>

    <main id="conteudo" class="flex-1 px-4 py-6 sm:px-6 lg:px-8 lg:py-8 2xl:px-12">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <p class="text-sm font-semibold text-teal-700 dark:text-teal-400">Portfólio do 4º trimestre</p>
          <h1 class="text-2xl font-extrabold tracking-tight sm:text-3xl">Bom dia, Marina</h1>
          <p id="summary-line" class="mt-1 text-sm text-stone-500 dark:text-stone-400"></p>
        </div>
        <button type="button" data-open-modal
          class="inline-flex items-center gap-2 rounded-lg border border-stone-300 bg-white px-4 py-2 text-sm font-semibold transition duration-200 hover:border-teal-600 hover:text-teal-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-600 active:scale-[0.98] dark:border-stone-700 dark:bg-stone-900 dark:hover:border-teal-500 dark:hover:text-teal-300">
          <svg class="icon h-4 w-4"><use href="#i-plus"/></svg>Novo projeto
        </button>
      </div>

      <section aria-label="Indicadores" class="mt-6 grid grid-cols-2 gap-3 sm:gap-4 xl:grid-cols-4">
        <article class="col-span-2 flex flex-col justify-between gap-6 rounded-xl bg-teal-700 p-5 text-white sm:col-span-1 dark:bg-teal-800">
          <div class="flex items-center justify-between"><h2 class="text-sm font-semibold text-teal-100">Projetos ativos</h2><svg class="icon h-5 w-5 text-teal-200"><use href="#i-layers"/></svg></div>
          <div><p id="kpi-active" class="text-4xl font-extrabold tabular-nums">0</p><p id="kpi-active-note" class="mt-1 text-xs text-teal-100"></p></div>
        </article>
        <article class="flex flex-col justify-between gap-6 rounded-xl border border-stone-200 bg-white p-5 dark:border-stone-800 dark:bg-stone-900">
          <div class="flex items-center justify-between"><h2 class="text-sm font-semibold text-stone-500 dark:text-stone-400">Projetos concluídos</h2><svg class="icon h-5 w-5 text-teal-600 dark:text-teal-400"><use href="#i-check"/></svg></div>
          <div><p id="kpi-done" class="text-3xl font-extrabold tabular-nums">0</p><p id="kpi-done-note" class="mt-1 text-xs text-stone-500 dark:text-stone-400"></p></div>
        </article>
        <article class="flex flex-col justify-between gap-6 rounded-xl border border-stone-200 bg-white p-5 dark:border-stone-800 dark:bg-stone-900">
          <div class="flex items-center justify-between"><h2 class="text-sm font-semibold text-stone-500 dark:text-stone-400">Tarefas pendentes</h2><svg class="icon h-5 w-5 text-amber-600 dark:text-amber-400"><use href="#i-list"/></svg></div>
          <div><p id="kpi-tasks" class="text-3xl font-extrabold tabular-nums">0</p><p id="kpi-tasks-note" class="mt-1 text-xs text-stone-500 dark:text-stone-400"></p></div>
        </article>
        <article class="flex flex-col justify-between gap-6 rounded-xl border border-stone-200 bg-white p-5 dark:border-stone-800 dark:bg-stone-900">
          <div class="flex items-center justify-between"><h2 class="text-sm font-semibold text-stone-500 dark:text-stone-400">Equipes</h2><svg class="icon h-5 w-5 text-stone-500 dark:text-stone-400"><use href="#i-users"/></svg></div>
          <div><p id="kpi-teams" class="text-3xl font-extrabold tabular-nums">0</p><p id="kpi-teams-note" class="mt-1 text-xs text-stone-500 dark:text-stone-400"></p></div>
        </article>
      </section>

      <section aria-labelledby="projects-title" class="mt-8">
        <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
          <h2 id="projects-title" class="text-lg font-bold">Projetos</h2>
          <p id="filter-note" class="text-sm text-stone-500 dark:text-stone-400" aria-live="polite"></p>
        </div>
        <div id="project-grid" class="grid grid-flow-dense grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4 xl:grid-cols-3 2xl:grid-cols-4"></div>
        <p id="empty-state" class="hidden rounded-xl border border-dashed border-stone-300 p-10 text-center text-sm text-stone-500 dark:border-stone-700 dark:text-stone-400">Nenhum projeto corresponde à busca ou ao filtro atual.</p>
      </section>
    </main>
  </div>
</div>

<div id="modal" class="fixed inset-0 z-50 hidden items-end justify-center bg-stone-950/60 p-0 sm:items-center sm:p-4" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="max-h-[92vh] w-full overflow-y-auto rounded-t-2xl bg-white shadow-xl dark:bg-stone-900 sm:max-w-lg sm:rounded-2xl">
    <div class="flex items-center justify-between border-b border-stone-200 px-5 py-4 dark:border-stone-800">
      <h2 id="modal-title" class="text-lg font-bold">Novo projeto</h2>
      <button type="button" data-close-modal aria-label="Fechar"
        class="rounded-md p-1.5 text-stone-500 transition hover:bg-stone-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-600 active:scale-95 dark:hover:bg-stone-800"><svg class="icon h-5 w-5"><use href="#i-x"/></svg></button>
    </div>
    <form id="project-form" novalidate class="flex flex-col gap-4 p-5">
      <p id="form-banner" role="alert" class="hidden rounded-lg px-3 py-2 text-sm font-medium"></p>
      <div class="field"><label for="f-name">Nome do projeto</label><input id="f-name" name="name" type="text" maxlength="60" autocomplete="off" class="input" aria-describedby="f-name-msg"><p id="f-name-msg" class="field-msg"></p></div>
      <div class="field"><label for="f-owner">Responsável</label><input id="f-owner" name="owner" type="text" maxlength="40" autocomplete="off" class="input" aria-describedby="f-owner-msg"><p id="f-owner-msg" class="field-msg"></p></div>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div class="field"><label for="f-category">Categoria</label>
          <select id="f-category" name="category" class="input" aria-describedby="f-category-msg">
            <option value="">Selecione</option><option>Desenvolvimento</option><option>Design</option><option>Dados</option><option>Infraestrutura</option><option>Marketing</option>
          </select><p id="f-category-msg" class="field-msg"></p></div>
        <div class="field"><label for="f-priority">Prioridade</label>
          <select id="f-priority" name="priority" class="input" aria-describedby="f-priority-msg">
            <option value="">Selecione</option><option>Alta</option><option>Média</option><option>Baixa</option>
          </select><p id="f-priority-msg" class="field-msg"></p></div>
      </div>
      <div class="field"><label for="f-deadline">Prazo</label><input id="f-deadline" name="deadline" type="date" class="input" aria-describedby="f-deadline-msg"><p id="f-deadline-msg" class="field-msg"></p></div>
      <div class="field"><label for="f-description">Descrição</label><textarea id="f-description" name="description" rows="3" maxlength="240" class="input resize-none" aria-describedby="f-description-msg"></textarea><p id="f-description-msg" class="field-msg"></p></div>
      <div class="flex flex-col-reverse gap-2 pt-1 sm:flex-row sm:justify-end">
        <button type="button" data-close-modal class="rounded-lg border border-stone-300 px-4 py-2.5 text-sm font-semibold transition hover:bg-stone-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-600 active:scale-[0.98] dark:border-stone-700 dark:hover:bg-stone-800">Cancelar</button>
        <button type="submit" id="submit-button" class="rounded-lg bg-teal-600 px-5 py-2.5 text-sm font-semibold text-white transition duration-200 hover:bg-teal-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-600 focus-visible:ring-offset-2 active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-50 dark:focus-visible:ring-offset-stone-900">Cadastrar projeto</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" role="status" aria-live="polite" class="pointer-events-none fixed bottom-4 left-1/2 z-[60] -translate-x-1/2 translate-y-4 rounded-lg bg-stone-900 px-4 py-2 text-sm font-medium text-white opacity-0 shadow-lg transition duration-300 ease-out dark:bg-stone-100 dark:text-stone-900"></div>

</body>
</html>
