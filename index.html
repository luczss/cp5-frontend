<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechFlow | Painel de projetos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['Instrument Sans', 'ui-sans-serif', 'system-ui', 'sans-serif'], serif: ['Fraunces', 'Georgia', 'serif'] },
      colors: { paper: '#f3eee3', ink: '#171512', clay: '#d9480f' }
    } }
  };
</script>
<link rel="stylesheet" href="src/css/style.css">
<script src="src/js/app.js" defer></script>
</head>
<body class="bg-paper font-sans text-ink antialiased dark:bg-ink dark:text-paper">

<svg width="0" height="0" class="absolute" aria-hidden="true">
  <defs>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  </defs>
</svg>

<div class="flex min-h-screen">
  <div id="sidebar-overlay" class="fixed inset-0 z-30 hidden bg-ink/60 lg:hidden" aria-hidden="true"></div>

  <aside id="sidebar" aria-label="Navegação principal"
    class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col bg-ink text-paper transition-transform duration-300 ease-out dark:border-r dark:border-paper/15 lg:sticky lg:top-0 lg:h-screen lg:shrink-0 lg:translate-x-0">
    <div class="flex h-16 items-center justify-between px-5">
      <a href="#conteudo" class="rounded-sm font-serif text-2xl font-bold tracking-tight focus:outline-none focus-visible:ring-2 focus-visible:ring-clay">TechFlow<span class="text-clay">.</span></a>
      <button type="button" id="sidebar-close" aria-label="Fechar menu" class="rounded-sm p-1.5 text-stone-400 transition hover:text-paper focus:outline-none focus-visible:ring-2 focus-visible:ring-clay active:scale-95 lg:hidden"><svg class="icon h-5 w-5"><use href="#i-x"/></svg></button>
    </div>
    <p class="px-5 pb-2 pt-8 text-[11px] font-semibold uppercase tracking-[.2em] text-stone-500">Visões</p>
    <nav class="flex flex-1 flex-col" aria-label="Filtrar projetos por status">
      <button type="button" data-status="all" class="nav-item"><span class="nav-num">01</span>Todos<span data-count="all" class="ml-auto font-serif text-sm"></span></button>
      <button type="button" data-status="Em andamento" class="nav-item"><span class="nav-num">02</span>Em andamento<span data-count="Em andamento" class="ml-auto font-serif text-sm"></span></button>
      <button type="button" data-status="Em revisão" class="nav-item"><span class="nav-num">03</span>Em revisão<span data-count="Em revisão" class="ml-auto font-serif text-sm"></span></button>
      <button type="button" data-status="Concluído" class="nav-item"><span class="nav-num">04</span>Concluídos<span data-count="Concluído" class="ml-auto font-serif text-sm"></span></button>
    </nav>
    <div class="p-5">
      <button type="button" data-open-modal class="flex w-full items-center justify-between bg-clay px-4 py-3 text-sm font-bold text-white transition duration-200 hover:bg-orange-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-paper focus-visible:ring-offset-2 focus-visible:ring-offset-ink active:scale-[0.98]">Novo projeto<svg class="icon h-4 w-4"><use href="#i-plus"/></svg></button>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="sticky top-0 z-20 flex h-16 items-center justify-between gap-3 border-b border-ink/15 bg-paper/90 px-4 backdrop-blur dark:border-paper/15 dark:bg-ink/90 sm:px-6 lg:px-10 2xl:px-14">
      <div class="flex min-w-0 flex-1 items-center gap-3">
        <button type="button" id="sidebar-toggle" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false" class="p-1.5 transition hover:text-clay focus:outline-none focus-visible:ring-2 focus-visible:ring-clay active:scale-95 lg:hidden"><svg class="icon h-6 w-6"><use href="#i-menu"/></svg></button>
        <div class="relative w-full max-w-sm">
          <label for="search" class="sr-only">Pesquisar projetos</label>
          <svg class="icon pointer-events-none absolute left-0 top-1/2 h-4 w-4 -translate-y-1/2 opacity-50"><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Buscar projeto, pessoa, equipe" autocomplete="off" class="w-full border-0 border-b-2 border-ink/20 bg-transparent py-2 pl-7 pr-2 text-sm placeholder:text-stone-500 transition focus:border-clay focus:outline-none dark:border-paper/20">
        </div>
      </div>
      <div class="flex items-center gap-3 sm:gap-5">
        <fieldset class="flex gap-1 sm:gap-3">
          <legend class="sr-only">Tema da interface</legend>
          <label class="cursor-pointer"><input type="radio" name="theme" value="light" class="peer sr-only"><span class="theme-pill peer-checked:border-clay peer-checked:text-ink peer-focus-visible:ring-2 peer-focus-visible:ring-clay dark:peer-checked:text-paper"><svg class="icon h-4 w-4 sm:hidden"><use href="#i-sun"/></svg><span class="hidden sm:inline">Light</span></span></label>
          <label class="cursor-pointer"><input type="radio" name="theme" value="dark" class="peer sr-only"><span class="theme-pill peer-checked:border-clay peer-checked:text-ink peer-focus-visible:ring-2 peer-focus-visible:ring-clay dark:peer-checked:text-paper"><svg class="icon h-4 w-4 sm:hidden"><use href="#i-moon"/></svg><span class="hidden sm:inline">Dark</span></span></label>
          <label class="cursor-pointer"><input type="radio" name="theme" value="system" class="peer sr-only"><span class="theme-pill peer-checked:border-clay peer-checked:text-ink peer-focus-visible:ring-2 peer-focus-visible:ring-clay dark:peer-checked:text-paper"><svg class="icon h-4 w-4 sm:hidden"><use href="#i-monitor"/></svg><span class="hidden sm:inline">System</span></span></label>
        </fieldset>
        <div class="relative">
          <button type="button" id="user-button" aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu" class="flex items-center gap-3 p-0.5 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-clay active:scale-95">
            <span class="hidden text-right leading-tight md:block"><span class="block text-sm font-bold">Diego Caio</span><span class="block text-xs text-stone-500 dark:text-stone-400">Gerente de produto</span></span>
            <span class="flex h-9 w-9 items-center justify-center bg-clay font-serif text-sm font-bold text-white">MD</span>
          </button>
          <div id="user-menu" role="menu" aria-labelledby="user-button" class="invisible absolute right-0 mt-3 w-60 origin-top-right scale-95 border-2 border-ink bg-paper opacity-0 shadow-[5px_5px_0_0_#171512] transition duration-150 ease-out dark:border-paper dark:bg-ink dark:shadow-[5px_5px_0_0_#f3eee3]">
            <div class="border-b border-ink/15 px-4 py-3 dark:border-paper/15"><p class="font-serif font-bold">Diego Caio</p><p class="truncate text-xs text-stone-500 dark:text-stone-400">Diego.Caio@techflow.com</p></div>
            <button type="button" role="menuitem" data-user-action="mine" class="menu-item">Ver meus projetos</button>
            <button type="button" role="menuitem" data-user-action="new" class="menu-item">Novo projeto</button>
            <button type="button" role="menuitem" data-user-action="clear" class="menu-item">Limpar filtros</button>
          </div>
        </div>
      </div>
    </header>

    <main id="conteudo" class="flex-1 px-4 py-8 sm:px-6 lg:px-10 lg:py-10 2xl:px-14">
      <div class="flex flex-wrap items-end justify-between gap-6">
        <div class="max-w-3xl">
          <p class="text-[11px] font-semibold uppercase tracking-[.2em] text-clay">Painel · 4º trimestre de 2026</p>
          <h1 id="summary-line" class="mt-2 font-serif text-3xl font-bold leading-tight tracking-tight sm:text-4xl xl:text-5xl"></h1>
        </div>
        <button type="button" data-open-modal class="inline-flex items-center gap-2 border-2 border-ink px-4 py-2.5 text-sm font-bold transition duration-200 hover:bg-ink hover:text-paper focus:outline-none focus-visible:ring-2 focus-visible:ring-clay focus-visible:ring-offset-2 active:scale-[0.98] dark:border-paper dark:hover:bg-paper dark:hover:text-ink dark:focus-visible:ring-offset-ink"><svg class="icon h-4 w-4"><use href="#i-plus"/></svg>Novo projeto</button>
      </div>

      <section aria-label="Indicadores" class="mt-8 grid grid-cols-2 gap-px border-y-2 border-ink bg-ink/20 dark:border-paper dark:bg-paper/20 xl:grid-cols-4">
        <article class="bg-paper p-4 sm:p-6 dark:bg-ink"><h2 class="text-[11px] font-semibold uppercase tracking-[.18em] text-stone-500 dark:text-stone-400">Projetos ativos</h2><p id="kpi-active" class="mt-3 font-serif text-5xl font-bold tabular-nums text-clay sm:text-6xl">0</p><p id="kpi-active-note" class="mt-2 text-xs text-stone-600 dark:text-stone-400"></p></article>
        <article class="bg-paper p-4 sm:p-6 dark:bg-ink"><h2 class="text-[11px] font-semibold uppercase tracking-[.18em] text-stone-500 dark:text-stone-400">Projetos concluídos</h2><p id="kpi-done" class="mt-3 font-serif text-5xl font-bold tabular-nums sm:text-6xl">0</p><p id="kpi-done-note" class="mt-2 text-xs text-stone-600 dark:text-stone-400"></p></article>
        <article class="bg-paper p-4 sm:p-6 dark:bg-ink"><h2 class="text-[11px] font-semibold uppercase tracking-[.18em] text-stone-500 dark:text-stone-400">Tarefas pendentes</h2><p id="kpi-tasks" class="mt-3 font-serif text-5xl font-bold tabular-nums sm:text-6xl">0</p><p id="kpi-tasks-note" class="mt-2 text-xs text-stone-600 dark:text-stone-400"></p></article>
        <article class="bg-paper p-4 sm:p-6 dark:bg-ink"><h2 class="text-[11px] font-semibold uppercase tracking-[.18em] text-stone-500 dark:text-stone-400">Equipes</h2><p id="kpi-teams" class="mt-3 font-serif text-5xl font-bold tabular-nums sm:text-6xl">0</p><p id="kpi-teams-note" class="mt-2 text-xs text-stone-600 dark:text-stone-400"></p></article>
      </section>

      <section aria-labelledby="projects-title" class="mt-10">
        <div class="mb-4 flex flex-wrap items-baseline justify-between gap-2">
          <h2 id="projects-title" class="font-serif text-2xl font-bold">Projetos</h2>
          <p id="filter-note" class="text-sm text-stone-600 dark:text-stone-400" aria-live="polite"></p>
        </div>
        <div id="project-grid" class="grid grid-flow-dense grid-cols-1 gap-4 sm:grid-cols-2 sm:gap-5 xl:grid-cols-3 2xl:grid-cols-4"></div>
        <p id="empty-state" class="hidden border-2 border-dashed border-ink/30 p-10 text-center text-sm text-stone-600 dark:border-paper/30 dark:text-stone-400">Nenhum projeto corresponde à busca ou ao filtro atual.</p>
      </section>
    </main>
  </div>
</div>

<div id="modal" class="fixed inset-0 z-50 hidden items-end justify-center bg-ink/70 p-0 sm:items-center sm:p-4" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="max-h-[92vh] w-full overflow-y-auto border-2 border-ink bg-paper dark:border-paper dark:bg-ink sm:max-w-lg">
    <div class="flex items-center justify-between border-b-2 border-ink px-5 py-4 dark:border-paper">
      <h2 id="modal-title" class="font-serif text-2xl font-bold">Novo projeto</h2>
      <button type="button" data-close-modal aria-label="Fechar" class="p-1.5 transition hover:text-clay focus:outline-none focus-visible:ring-2 focus-visible:ring-clay active:scale-95"><svg class="icon h-5 w-5"><use href="#i-x"/></svg></button>
    </div>
    <form id="project-form" novalidate class="flex flex-col gap-4 p-5">
      <p id="form-banner" role="alert" class="hidden"></p>
      <div class="field"><label for="f-name">Nome do projeto</label><input id="f-name" name="name" type="text" maxlength="60" autocomplete="off" class="input" aria-describedby="f-name-msg"><p id="f-name-msg" class="field-msg"></p></div>
      <div class="field"><label for="f-owner">Responsável</label><input id="f-owner" name="owner" type="text" maxlength="40" autocomplete="off" class="input" aria-describedby="f-owner-msg"><p id="f-owner-msg" class="field-msg"></p></div>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div class="field"><label for="f-category">Categoria</label><select id="f-category" name="category" class="input" aria-describedby="f-category-msg"><option value="">Selecione</option><option>Desenvolvimento</option><option>Design</option><option>Dados</option><option>Infraestrutura</option><option>Marketing</option></select><p id="f-category-msg" class="field-msg"></p></div>
        <div class="field"><label for="f-priority">Prioridade</label><select id="f-priority" name="priority" class="input" aria-describedby="f-priority-msg"><option value="">Selecione</option><option>Alta</option><option>Média</option><option>Baixa</option></select><p id="f-priority-msg" class="field-msg"></p></div>
      </div>
      <div class="field"><label for="f-deadline">Prazo</label><input id="f-deadline" name="deadline" type="date" class="input" aria-describedby="f-deadline-msg"><p id="f-deadline-msg" class="field-msg"></p></div>
      <div class="field"><label for="f-description">Descrição</label><textarea id="f-description" name="description" rows="3" maxlength="240" class="input resize-none" aria-describedby="f-description-msg"></textarea><p id="f-description-msg" class="field-msg"></p></div>
      <div class="flex flex-col-reverse gap-2 pt-1 sm:flex-row sm:justify-end">
        <button type="button" data-close-modal class="border-2 border-ink px-4 py-2.5 text-sm font-bold transition hover:bg-ink hover:text-paper focus:outline-none focus-visible:ring-2 focus-visible:ring-clay active:scale-[0.98] dark:border-paper dark:hover:bg-paper dark:hover:text-ink">Cancelar</button>
        <button type="submit" id="submit-button" class="bg-clay px-5 py-2.5 text-sm font-bold text-white transition duration-200 hover:bg-orange-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-clay focus-visible:ring-offset-2 active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-50 dark:focus-visible:ring-offset-ink">Cadastrar projeto</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" role="status" aria-live="polite" class="pointer-events-none fixed bottom-4 left-1/2 z-[60] -translate-x-1/2 translate-y-4 bg-ink px-4 py-2 text-sm font-semibold text-paper opacity-0 transition duration-300 ease-out dark:bg-paper dark:text-ink"></div>

</body>
</html>
